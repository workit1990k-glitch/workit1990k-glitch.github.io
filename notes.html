<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save to Read Later · LocalStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        div#contentInput {
            width: 100%;
            max-height: 150px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: auto;
            background: white;
            font-family: inherit;
            font-size: inherit;
            line-height: 1.4;
        }
        div#contentInput:empty:before {
            content: attr(placeholder);
            color: #999;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button.readLaterItem {
            color: black;
        }
        .action-btn {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-left: 6px;
            color: white;
        }
        .edit-btn {
            background-color: #2196F3;
        }
        .edit-btn:hover {
            background-color: #0b7dda;
        }
        .delete-btn {
            background-color: #f44336;
        }
        .delete-btn:hover {
            background-color: #da190b;
        }
        #epubButton {
            background-color: #673AB7;
            margin-bottom: 10px;
            display: none;
        }
        #epubButton:hover {
            background-color: #512DA8;
        }
        #message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
        }
        .processing {
            color: #31708f;
            background-color: #d9edf7;
            border-color: #bce8f1;
        }
        #faviconContainer img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            vertical-align: middle;
        }
        .item-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .item-row .readLaterItem {
            flex: 1;
            margin: 0;
        }
        .list-favicon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            margin-right: 8px;
        }
        .list-favicon-placeholder {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: #eee;
            border-radius: 4px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }
        .toolbar button {
            font-size: 14px;
            padding: 8px 14px;
        }
        #syncStatus {
            font-size: 13px;
            color: #666;
            margin-left: 8px;
        }
        .token-section {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .token-section label {
            font-size: 13px;
            color: #333;
            margin-bottom: 6px;
        }
        .token-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .token-row input {
            flex: 1;
            font-family: monospace;
            font-size: 13px;
        }
        .token-row button {
            font-size: 13px;
            padding: 6px 10px;
            background-color: #607D8B;
        }
        .token-row button:hover {
            background-color: #455A64;
        }
        .token-hint {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
        #tokenStatus {
            font-size: 12px;
            color: #4CAF50;
            margin-left: 6px;
        }
    </style>
</head>
<body>

    <h1>Save to Read Later</h1>
    <div class="form-group">
        <label for="titleInput">Title:</label>
        <input type="text" id="titleInput" placeholder="Enter the title..." required>
    </div>
    <div class="form-group">
        <label for="linkInput">Link:</label>
        <div id="faviconContainer"></div>
        <input type="text" id="linkInput" placeholder="Enter the link (e.g., https://example.com)...">
    </div>
    <div class="form-group">
        <label for="contentInput">Content:</label>
        <div id="contentInput" contenteditable="true" 
             style="width: 100%; max-height: 150px; padding: 8px; box-sizing: border-box; 
                    border: 1px solid #ccc; border-radius: 4px; overflow: auto;"
             placeholder="Enter the content..."></div>
    </div>
    <button id="saveButton">Save to Read Later</button>
    <button id="cancelEditButton" style="display: none; background-color: #777;">Cancel Edit</button>

    <div id="message"></div>
    <hr>
    <h2>Read Later List</h2>

    <!-- GitHub Token Section -->
    <div class="token-section" id="tokenSection">
        <label for="tokenInput">🔑 GitHub Personal Access Token (repo scope):</label>
        <div class="token-row">
            <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
            <button id="toggleTokenVisibility" type="button">👁 Show</button>
            <button id="clearTokenButton" type="button" style="background-color: #f44336;">✕ Clear</button>
            <span id="tokenStatus"></span>
        </div>
        <div class="token-hint">Token is kept in memory only — never saved to disk. Required for Save JSON to GitHub.</div>
    </div>

    <div class="toolbar">
        <button id="loadListButton">Load Read Later List</button>
        <button id="epubButton">📚 Export All as EPUB</button>
        <button id="saveJsonButton" style="background-color: #ff9800;">💾 Save JSON to GitHub</button>
        <button id="loadJsonButton" style="background-color: #2196F3;">📂 Load JSON from GitHub</button>
        <span id="syncStatus"></span>
    </div>
    <input type="text" id="searchInput" placeholder="Search saved items..." style="width: 100%; padding: 8px; margin-bottom: 10px; display: none;">
    <button id="toggleOrderBtn" style="margin-bottom: 10px; display: none;">Show Newest First</button>
    <div id="readLaterList" style="margin-top: 20px;"></div>

    <div id="blogPostView" style="display: none; margin-top: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9;">
        <h2 id="blogTitle"></h2>
        <p><strong>Link:</strong> <a id="blogLink" target="_blank"></a></p>
        <div id="blogContent" style="margin-top: 15px; line-height: 1.6;"></div>
        <button id="backToList" style="margin-top: 20px;">← Back to List</button>
    </div>

    <!-- JSZip for building the EPUB and ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM elements
            const titleInput = document.getElementById('titleInput');
            const linkInput = document.getElementById('linkInput');
            const contentInput = document.getElementById('contentInput');
            const saveButton = document.getElementById('saveButton');
            const cancelEditButton = document.getElementById('cancelEditButton');
            const messageDiv = document.getElementById('message');
            const faviconContainer = document.getElementById('faviconContainer');
            const syncStatus = document.getElementById('syncStatus');

            // Token elements
            const tokenInput = document.getElementById('tokenInput');
            const toggleTokenVisibility = document.getElementById('toggleTokenVisibility');
            const clearTokenButton = document.getElementById('clearTokenButton');
            const tokenStatus = document.getElementById('tokenStatus');

            const STORAGE_KEY = 'readLaterItems';
            let editingId = null;
            let githubToken = ''; // kept in memory only

            // ---------- Token UI ----------
            tokenInput.addEventListener('input', () => {
                githubToken = tokenInput.value.trim();
                if (githubToken) {
                    tokenStatus.textContent = '✓ token set';
                    tokenStatus.style.color = '#4CAF50';
                } else {
                    tokenStatus.textContent = '';
                }
            });

            toggleTokenVisibility.addEventListener('click', () => {
                if (tokenInput.type === 'password') {
                    tokenInput.type = 'text';
                    toggleTokenVisibility.textContent = '🙈 Hide';
                } else {
                    tokenInput.type = 'password';
                    toggleTokenVisibility.textContent = '👁 Show';
                }
            });

            clearTokenButton.addEventListener('click', () => {
                tokenInput.value = '';
                githubToken = '';
                tokenStatus.textContent = '';
                tokenInput.type = 'password';
                toggleTokenVisibility.textContent = '👁 Show';
            });

            // ---------- Storage helpers ----------
            function getStoredItems() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return [];
                    const parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    console.error('Failed to parse localStorage data', e);
                    return [];
                }
            }

            function setStoredItems(items) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            }

            // ---------- URL auto-fill ----------
            const urlParams = new URLSearchParams(window.location.search);
            const initialTitle = urlParams.get('title');
            const initialLink = urlParams.get('link');
            const initialContentB64 = urlParams.get('content_b64');

            if (initialTitle) titleInput.value = decodeURIComponent(initialTitle);
            if (initialLink) {
                linkInput.value = decodeURIComponent(initialLink);
                updateFavicon(linkInput.value);
            }
            if (initialContentB64) {
                try {
                    const decoded = decodeURIComponent(atob(initialContentB64));
                    contentInput.innerText = decoded;
                } catch (e) {
                    console.error('Failed to decode Base64 content:', e);
                    contentInput.innerText = 'Failed to load description.';
                }
            }

            // ---------- Favicon ----------
            function updateFavicon(url) {
                if (!url) {
                    faviconContainer.innerHTML = '';
                    return;
                }
                try {
                    const urlObj = new URL(url);
                    const domain = urlObj.hostname;
                    faviconContainer.innerHTML = `
                        <img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32" 
                             alt="Favicon">
                    `;
                } catch (e) {
                    faviconContainer.innerHTML = '';
                }
            }

            let faviconTimeout;
            linkInput.addEventListener('input', () => {
                clearTimeout(faviconTimeout);
                faviconTimeout = setTimeout(() => updateFavicon(linkInput.value), 500);
            });

            // ---------- Save / Update ----------
            saveButton.addEventListener('click', () => {
                const title = titleInput.value.trim();
                const link = linkInput.value.trim();
                const content = contentInput.innerText.trim();

                if (!title) {
                    showMessage('Please fill in title.', 'error');
                    return;
                }

                saveButton.disabled = true;
                showMessage(editingId ? 'Updating...' : 'Saving...', 'processing');

                try {
                    const items = getStoredItems();

                    if (editingId) {
                        const index = items.findIndex(i => i.id === editingId);
                        if (index === -1) throw new Error('Item not found for editing.');

                        items[index] = {
                            ...items[index],
                            title,
                            link,
                            content,
                            updatedAt: new Date().toISOString()
                        };
                        setStoredItems(items);
                        showMessage(`Updated "${title}".`, 'success');
                        exitEditMode();
                    } else {
                        const newItem = {
                            id: Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                            title,
                            link,
                            content,
                            savedAt: new Date().toISOString()
                        };
                        items.push(newItem);
                        setStoredItems(items);
                        showMessage(`Saved "${title}".`, 'success');
                    }

                    // Clear form
                    titleInput.value = '';
                    linkInput.value = '';
                    contentInput.innerText = '';
                    faviconContainer.innerHTML = '';

                    // Refresh list if visible
                    if (readLaterList.style.display !== 'none' && originalItems.length > 0) {
                        originalItems = getStoredItems();
                        renderList();
                    }
                } catch (error) {
                    console.error('Error saving:', error);
                    showMessage(`Error: ${error.message}`, 'error');
                } finally {
                    saveButton.disabled = false;
                }
            });

            // ---------- Cancel edit ----------
            cancelEditButton.addEventListener('click', () => {
                exitEditMode();
                showMessage('Edit cancelled.', 'processing');
            });

            function enterEditMode(item) {
                editingId = item.id;
                titleInput.value = item.title || '';
                linkInput.value = item.link || '';
                contentInput.innerText = item.content || '';
                updateFavicon(item.link || '');

                saveButton.textContent = 'Update Article';
                cancelEditButton.style.display = 'inline-block';

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function exitEditMode() {
                editingId = null;
                titleInput.value = '';
                linkInput.value = '';
                contentInput.innerText = '';
                faviconContainer.innerHTML = '';
                saveButton.textContent = 'Save to Read Later';
                cancelEditButton.style.display = 'none';
            }

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = '';
                if (type) messageDiv.classList.add(type);
                messageDiv.style.display = text ? 'block' : 'none';
            }

            // ========== READ LATER LIST UI ==========
            const loadListButton = document.getElementById('loadListButton');
            const readLaterList = document.getElementById('readLaterList');
            const blogPostView = document.getElementById('blogPostView');
            const blogTitle = document.getElementById('blogTitle');
            const blogLink = document.getElementById('blogLink');
            const blogContent = document.getElementById('blogContent');
            const backToListBtn = document.getElementById('backToList');
            const searchInput = document.getElementById('searchInput');
            const toggleOrderBtn = document.getElementById('toggleOrderBtn');
            const epubButton = document.getElementById('epubButton');
            const saveJsonButton = document.getElementById('saveJsonButton');
            const loadJsonButton = document.getElementById('loadJsonButton');

            let originalItems = [];
            let isReversed = true;

            loadListButton.addEventListener('click', () => {
                loadListButton.disabled = true;
                readLaterList.innerHTML = '<p>Loading...</p>';

                try {
                    originalItems = getStoredItems();

                    if (!Array.isArray(originalItems) || originalItems.length === 0) {
                        readLaterList.innerHTML = '<p>No items saved yet.</p>';
                        searchInput.style.display = 'none';
                        toggleOrderBtn.style.display = 'none';
                        epubButton.style.display = 'none';
                    } else {
                        searchInput.style.display = 'block';
                        toggleOrderBtn.style.display = 'block';
                        epubButton.style.display = 'inline-block';
                        toggleOrderBtn.textContent = isReversed ? 'Show Oldest First' : 'Show Newest First';
                        renderList();
                    }
                } catch (error) {
                    console.error('Failed to load list:', error);
                    readLaterList.innerHTML = `<p style="color: red;">Error loading list: ${error.message}</p>`;
                } finally {
                    loadListButton.disabled = false;
                }
            });

            function extractFirstImageUrl(content) {
                if (!content) return null;
                const imgTagMatch = content.match(/<img[^>]+src=["']([^"']+\.(?:webp|jpe?g|png))["'][^>]*>/i);
                if (imgTagMatch && imgTagMatch[1]) {
                    try { return new URL(imgTagMatch[1], window.location.href).href; }
                    catch (e) { return imgTagMatch[1]; }
                }
                const urlRegex = /\bhttps?:\/\/[^\s<>"']+\.(?:webp|jpe?g|png)\b/ig;
                const plainUrlMatch = content.match(urlRegex);
                if (plainUrlMatch && plainUrlMatch[0]) {
                    try { return new URL(plainUrlMatch[0], window.location.href).href; }
                    catch (e) { return plainUrlMatch[0]; }
                }
                return null;
            }

            function getFaviconUrl(link) {
                if (!link) return null;
                try {
                    const urlObj = new URL(link);
                    return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(urlObj.hostname)}&sz=32`;
                } catch (e) {
                    return null;
                }
            }

            function renderList() {
                let displayedItems = [...originalItems];

                const searchTerm = searchInput.value.trim().toLowerCase();
                if (searchTerm) {
                    displayedItems = displayedItems.filter(item =>
                        (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                        (item.content && item.content.toLowerCase().includes(searchTerm))
                    );
                }

                if (isReversed) displayedItems = [...displayedItems].reverse();

                if (displayedItems.length === 0) {
                    readLaterList.innerHTML = searchTerm
                        ? '<p>No matching items found.</p>'
                        : '<p>No items saved yet.</p>';
                    return;
                }

                const listHtml = displayedItems.map(item => {
                    const originalIndex = originalItems.indexOf(item);
                    const faviconUrl = getFaviconUrl(item.link);
                    const faviconHtml = faviconUrl
                        ? `<img src="${faviconUrl}" alt="" class="list-favicon" loading="lazy"
                                onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')">`
                        : '';
                    const placeholderHtml = faviconUrl
                        ? `<span class="list-favicon-placeholder" style="display:none;">🔗</span>`
                        : `<span class="list-favicon-placeholder">🔗</span>`;

                    return `
                        <div class="item-row" data-item-id="${item.id}">
                            <button class="readLaterItem" data-original-index="${originalIndex}"
                                style="text-align: left; padding: 10px; border: 1px solid #ccc; 
                                       border-radius: 4px; background: white; cursor: pointer; 
                                       display: flex; align-items: center; justify-content: space-between;">
                                <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center;">
                                    ${faviconHtml}
                                    ${placeholderHtml}
                                    ${escapeHtml(item.title) || '(No title)'}
                                </span>
                            </button>
                            <button class="action-btn edit-btn" data-action="edit" data-item-id="${item.id}">Edit</button>
                            <button class="action-btn delete-btn" data-action="delete" data-item-id="${item.id}">Delete</button>
                        </div>`;
                }).join('');

                readLaterList.innerHTML = listHtml;

                document.querySelectorAll('.readLaterItem').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.getAttribute('data-original-index'), 10);
                        const item = originalItems[idx];
                        if (item) showBlogPost(item);
                    });
                });

                document.querySelectorAll('[data-action="edit"]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.getAttribute('data-item-id');
                        const item = originalItems.find(i => i.id === id);
                        if (item) {
                            enterEditMode(item);
                            blogPostView.style.display = 'none';
                            readLaterList.style.display = 'none';
                            loadListButton.style.display = 'none';
                            searchInput.style.display = 'none';
                            toggleOrderBtn.style.display = 'none';
                            epubButton.style.display = 'none';
                        }
                    });
                });

                document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.getAttribute('data-item-id');
                        deleteItem(id);
                    });
                });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function deleteItem(id) {
                const item = originalItems.find(i => i.id === id);
                if (!item) return;

                const confirmed = confirm(`Delete "${item.title}"? This cannot be undone.`);
                if (!confirmed) return;

                try {
                    if (editingId === id) exitEditMode();

                    const items = getStoredItems();
                    const filtered = items.filter(i => i.id !== id);
                    setStoredItems(filtered);

                    originalItems = filtered;

                    if (originalItems.length === 0) {
                        readLaterList.innerHTML = '<p>No items saved yet.</p>';
                        searchInput.style.display = 'none';
                        toggleOrderBtn.style.display = 'none';
                        epubButton.style.display = 'none';
                    } else {
                        renderList();
                    }
                    showMessage(`Deleted "${item.title}".`, 'success');
                } catch (error) {
                    console.error('Delete failed:', error);
                    showMessage(`Error deleting: ${error.message}`, 'error');
                }
            }

            function showBlogPost(item) {
                blogTitle.textContent = item.title || '(No title)';
                blogLink.textContent = item.link || '';
                blogLink.href = item.link || '#';
                blogContent.innerHTML = item.content ? item.content.replace(/\n/g, '<br>') : '(No content)';

                readLaterList.style.display = 'none';
                loadListButton.style.display = 'none';
                searchInput.style.display = 'none';
                toggleOrderBtn.style.display = 'none';
                epubButton.style.display = 'none';
                blogPostView.style.display = 'block';
            }

            backToListBtn.addEventListener('click', () => {
                blogPostView.style.display = 'none';
                readLaterList.style.display = 'block';
                loadListButton.style.display = 'inline-block';

                // Always reload from storage to ensure fresh state
                originalItems = getStoredItems();

                if (originalItems.length > 0) {
                    searchInput.style.display = 'block';
                    toggleOrderBtn.style.display = 'block';
                    epubButton.style.display = 'inline-block';
                    renderList();
                } else {
                    searchInput.style.display = 'none';
                    toggleOrderBtn.style.display = 'none';
                    epubButton.style.display = 'none';
                    readLaterList.innerHTML = '<p>No items saved yet.</p>';
                }
            });

            searchInput.addEventListener('input', () => renderList());
            toggleOrderBtn.addEventListener('click', () => {
                isReversed = !isReversed;
                toggleOrderBtn.textContent = isReversed ? 'Show Oldest First' : 'Show Newest First';
                renderList();
            });

            // ============================================================
            // JSON SAVE / LOAD TO GITHUB (password protected ZIP)
            // ============================================================
            const GITHUB_USER = 'workit1990k-glitch';
            const GITHUB_REPO = 'notes';
            const GITHUB_BRANCH = 'main';
            const ZIP_PASSWORD = 'F5dkSfC';
            const ZIP_FILENAME = 'notes.zip';

            function getGitHubRawUrl() {
                return `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${ZIP_FILENAME}`;
            }

            function getGitHubApiUrl() {
                return `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ZIP_FILENAME}`;
            }

            // Encrypt JSON string with AES-GCM using password-derived key
            async function encryptJson(jsonStr, password) {
                const enc = new TextEncoder();
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));

                const keyMaterial = await crypto.subtle.importKey(
                    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
                );

                const key = await crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt']
                );

                const encrypted = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    enc.encode(jsonStr)
                );

                // Format: salt(16) + iv(12) + ciphertext
                const result = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
                result.set(salt, 0);
                result.set(iv, salt.length);
                result.set(new Uint8Array(encrypted), salt.length + iv.length);
                return result;
            }

            // Decrypt with AES-GCM
            async function decryptJson(encryptedData, password) {
                const enc = new TextEncoder();
                const dec = new TextDecoder();

                if (encryptedData.length < 28) throw new Error('Invalid encrypted data');

                const salt = encryptedData.slice(0, 16);
                const iv = encryptedData.slice(16, 28);
                const ciphertext = encryptedData.slice(28);

                const keyMaterial = await crypto.subtle.importKey(
                    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
                );

                const key = await crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );

                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    ciphertext
                );

                return dec.decode(decrypted);
            }

            // Save JSON to GitHub as password-protected ZIP
            saveJsonButton.addEventListener('click', async () => {
                if (!githubToken) {
                    showMessage('Please enter your GitHub token in the field above.', 'error');
                    tokenInput.focus();
                    return;
                }

                saveJsonButton.disabled = true;
                syncStatus.textContent = 'Encrypting & uploading...';
                showMessage('Preparing JSON and uploading to GitHub...', 'processing');

                try {
                    const items = getStoredItems();
                    const jsonStr = JSON.stringify(items, null, 2);

                    // Encrypt JSON with password
                    const encryptedBytes = await encryptJson(jsonStr, ZIP_PASSWORD);

                    // Create ZIP containing the encrypted file
                    const zip = new JSZip();
                    zip.file('notes.json.enc', encryptedBytes);
                    const zipBlob = await zip.generateAsync({
                        type: 'blob',
                        compression: 'DEFLATE'
                    });

                    // Convert blob to base64 for GitHub API
                    const reader = new FileReader();
                    const base64Promise = new Promise((resolve, reject) => {
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = reject;
                        reader.readAsDataURL(zipBlob);
                    });
                    const base64Content = await base64Promise;

                    // Get current file SHA if it exists
                    let sha = null;
                    try {
                        const getRes = await fetch(getGitHubApiUrl(), {
                            headers: {
                                'Authorization': `token ${githubToken}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        });
                        if (getRes.ok) {
                            const data = await getRes.json();
                            sha = data.sha;
                        }
                    } catch (e) {
                        // File doesn't exist, will create new
                    }

                    // Upload to GitHub
                    const body = {
                        message: `Update notes.zip (${new Date().toISOString()})`,
                        content: base64Content,
                        branch: GITHUB_BRANCH
                    };
                    if (sha) body.sha = sha;

                    const putRes = await fetch(getGitHubApiUrl(), {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${githubToken}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    if (!putRes.ok) {
                        const errData = await putRes.json().catch(() => ({}));
                        throw new Error(errData.message || `GitHub API error: ${putRes.status}`);
                    }

                    syncStatus.textContent = `Saved at ${new Date().toLocaleTimeString()}`;
                    showMessage(`✅ Saved ${items.length} items to GitHub (${ZIP_FILENAME}).`, 'success');
                } catch (err) {
                    console.error('Save to GitHub failed:', err);
                    syncStatus.textContent = 'Save failed';
                    showMessage(`Save error: ${err.message}`, 'error');
                } finally {
                    saveJsonButton.disabled = false;
                }
            });

            // Load JSON from GitHub (password-protected ZIP)
            loadJsonButton.addEventListener('click', async () => {
                if (!confirm('Load notes.zip from GitHub and replace local data? This cannot be undone.')) return;

                loadJsonButton.disabled = true;
                syncStatus.textContent = 'Downloading & decrypting...';
                showMessage('Fetching notes.zip from GitHub...', 'processing');

                try {
                    // Fetch the raw ZIP file from GitHub
                    const response = await fetch(getGitHubRawUrl() + '?t=' + Date.now());
                    if (!response.ok) {
                        throw new Error(`Failed to fetch ZIP: ${response.status} ${response.statusText}`);
                    }

                    const zipBlob = await response.blob();

                    // Unzip with JSZip
                    const zip = await JSZip.loadAsync(zipBlob);
                    const encFile = zip.file('notes.json.enc');
                    if (!encFile) {
                        throw new Error('notes.json.enc not found inside the ZIP.');
                    }

                    const encBytes = await encFile.async('uint8array');

                    // Decrypt with password
                    const jsonStr = await decryptJson(encBytes, ZIP_PASSWORD);

                    // Parse and validate
                    const parsed = JSON.parse(jsonStr);
                    if (!Array.isArray(parsed)) {
                        throw new Error('Decrypted data is not a valid array.');
                    }

                    // Replace localStorage
                    setStoredItems(parsed);
                    originalItems = parsed;

                    // Refresh UI
                    if (parsed.length > 0) {
                        readLaterList.style.display = 'block';
                        loadListButton.style.display = 'inline-block';
                        searchInput.style.display = 'block';
                        toggleOrderBtn.style.display = 'block';
                        epubButton.style.display = 'inline-block';
                        blogPostView.style.display = 'none';
                        renderList();
                    } else {
                        readLaterList.innerHTML = '<p>No items saved yet.</p>';
                        searchInput.style.display = 'none';
                        toggleOrderBtn.style.display = 'none';
                        epubButton.style.display = 'none';
                    }

                    syncStatus.textContent = `Loaded at ${new Date().toLocaleTimeString()}`;
                    showMessage(`✅ Loaded ${parsed.length} items from GitHub.`, 'success');
                } catch (err) {
                    console.error('Load from GitHub failed:', err);
                    syncStatus.textContent = 'Load failed';
                    showMessage(`Load error: ${err.message}`, 'error');
                } finally {
                    loadJsonButton.disabled = false;
                }
            });

            // ============================================================
            // EPUB EXPORT
            // ============================================================
            epubButton.addEventListener('click', async () => {
                const items = getStoredItems();
                if (!items.length) {
                    showMessage('No items to export.', 'error');
                    return;
                }

                epubButton.disabled = true;
                showMessage('Building EPUB...', 'processing');

                try {
                    const blob = await buildEpub(items);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
a.download = `Favorites ${ts}.epub`;                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showMessage(`EPUB exported with ${items.length} article(s).`, 'success');
                } catch (err) {
                    console.error('EPUB export failed:', err);
                    showMessage(`EPUB error: ${err.message}`, 'error');
                } finally {
                    epubButton.disabled = false;
                }
            });

            // -------- EPUB builder --------
            async function buildEpub(items) {
                const zip = new JSZip();
                const uuid = generateUuid();
                const bookId = `urn:uuid:${uuid}`;
                const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');

                // ----- mimetype (must be first, uncompressed) -----
                zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });

                // ----- META-INF/container.xml -----
                zip.folder('META-INF').file('container.xml', `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
  </rootfiles>
</container>`);

                // ----- OEBPS folder -----
                const oebps = zip.folder('OEBPS');
                const css = `
body { font-family: Georgia, serif; line-height: 1.6; margin: 1em; }
h1, h2 { font-family: Arial, sans-serif; }
a { color: #0066cc; word-break: break-all; }
.meta { color: #666; font-size: 0.9em; margin-bottom: 1em; }
.content { margin-top: 1em; white-space: pre-wrap; }
img { max-width: 100%; height: auto; }
`;
                oebps.file('styles.css', css);

                // ----- Chapters -----
                const chapterFiles = [];
                items.forEach((item, idx) => {
                    const fileName = `chapter${idx + 1}.xhtml`;
                    chapterFiles.push(fileName);
                    const safeTitle = escapeXml(item.title || `Article ${idx + 1}`);
                    const safeLink = item.link ? escapeXml(item.link) : '';
                    const contentHtml = renderContentToHtml(item.content || '');

                    const linkHtml = safeLink
                        ? `<p class="meta"><strong>Link:</strong> <a href="${safeLink}">${safeLink}</a></p>`
                        : '';

                    const xhtml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>${safeTitle}</title>
  <link rel="stylesheet" type="text/css" href="styles.css"/>
</head>
<body>
  <h1>${safeTitle}</h1>
  ${linkHtml}
  <div class="content">${contentHtml}</div>
</body>
</html>`;
                    oebps.file(fileName, xhtml);
                });

                // ----- Table of Contents (nav.xhtml) -----
                const tocEntries = items.map((item, idx) => {
                    const t = escapeXml(item.title || `Article ${idx + 1}`);
                    return `      <li><a href="chapter${idx + 1}.xhtml">${t}</a></li>`;
                }).join('\n');

                const navXhtml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="en" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Favorites and data</title>
  <link rel="stylesheet" type="text/css" href="styles.css"/>
</head>
<body>
  <nav epub:type="toc" id="toc">
    <h1>Favorites and data</h1>
    <ol>
${tocEntries}
    </ol>
  </nav>
</body>
</html>`;
                oebps.file('nav.xhtml', navXhtml);

                // ----- NCX (for EPUB 2 compatibility) -----
                const ncxPoints = items.map((item, idx) => {
                    const t = escapeXml(item.title || `Article ${idx + 1}`);
                    return `    <navPoint id="navPoint-${idx + 1}" playOrder="${idx + 1}">
      <navLabel><text>${t}</text></navLabel>
      <content src="chapter${idx + 1}.xhtml"/>
    </navPoint>`;
                }).join('\n');

                const ncx = `<?xml version="1.0" encoding="UTF-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
  <head>
    <meta name="dtb:uid" content="${bookId}"/>
    <meta name="dtb:depth" content="1"/>
    <meta name="dtb:totalPageCount" content="0"/>
    <meta name="dtb:maxPageNumber" content="0"/>
  </head>
  <docTitle><text>Favorites and data</text></docTitle>
  <navMap>
${ncxPoints}
  </navMap>
</ncx>`;
                oebps.file('toc.ncx', ncx);

                // ----- content.opf -----
                const manifestItems = items.map((_, idx) =>
                    `    <item id="chapter${idx + 1}" href="chapter${idx + 1}.xhtml" media-type="application/xhtml+xml"/>`
                ).join('\n');

                const spineItems = items.map((_, idx) =>
                    `    <itemref idref="chapter${idx + 1}"/>`
                ).join('\n');

                const opf = `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:identifier id="bookid">${bookId}</dc:identifier>
    <dc:title>Favorites and data</dc:title>
    <dc:language>en</dc:language>
    <dc:creator>Read Later</dc:creator>
    <meta property="dcterms:modified">${now}</meta>
  </metadata>
  <manifest>
    <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
    <item id="css" href="styles.css" media-type="text/css"/>
${manifestItems}
  </manifest>
  <spine toc="ncx">
${spineItems}
  </spine>
</package>`;
                oebps.file('content.opf', opf);

                // ----- Generate blob -----
                return await zip.generateAsync({
                    type: 'blob',
                    mimeType: 'application/epub+zip',
                    compression: 'DEFLATE'
                });
            }

            // Render stored content into XHTML-safe HTML
            function renderContentToHtml(content) {
                if (!content) return '';
                let escaped = escapeXml(content);
                return escaped.replace(/\n/g, '<br/>');
            }

            function escapeXml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&apos;');
            }

            function generateUuid() {
                if (crypto && crypto.randomUUID) return crypto.randomUUID();
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }
        });
    </script>
</body>
</html>
