<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Reader · Novel Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #2b2b38;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .reader-container {
            width: 100%;
            max-width: 900px;
            height: 92vh;
            background: #f5f1e8;  /* warm paper tone */
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== Toolbar ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            background: #efe9dc;
            border-bottom: 1px solid #d9d0bd;
            z-index: 5;
        }

        .toolbar button, .file-label {
            background: #fffdf8;
            border: 1px solid #d9d0bd;
            border-radius: 8px;
            padding: 7px 14px;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.15s;
            color: #4a3f30;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .toolbar button:hover:not(:disabled) {
            background: #f0e9d8;
            border-color: #b8a98c;
        }

        .toolbar button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .file-label {
            background: #7a5c3e;
            color: #fff8ec;
            border: none;
            box-shadow: 0 2px 6px rgba(122, 92, 62, 0.3);
        }

        .file-label:hover { background: #634a31; }
        .file-label input { display: none; }

        .spacer { flex: 1; }

        .chapter-info {
            font-size: 0.82rem;
            background: #e5dcc8;
            padding: 5px 12px;
            border-radius: 20px;
            color: #5c4d38;
            font-weight: 500;
            max-width: 240px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== Viewer (scrolling novel area) ===== */
        #viewer {
            flex: 1;
            overflow-y: auto;
            background: #f5f1e8;
            position: relative;
            scroll-behavior: smooth;
        }

        /* Novel-style content container */
        .novel-content {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 32px 80px;
            font-family: 'Georgia', 'Noto Serif SC', 'Noto Serif JP', 'Songti SC', 'SimSun', serif;
            font-size: 1.05rem;
            line-height: 2;
            color: #2a241c;
            letter-spacing: 0.02em;
        }

        .novel-content h1,
        .novel-content h2,
        .novel-content h3 {
            font-family: inherit;
            font-weight: 600;
            line-height: 1.4;
            margin: 1.8em 0 1em;
            color: #1a1510;
        }

        .novel-content h1 { font-size: 1.6rem; text-align: center; margin-top: 0.5em; }
        .novel-content h2 { font-size: 1.35rem; }
        .novel-content h3 { font-size: 1.15rem; }

        .novel-content p {
            margin: 1em 0;
            text-indent: 2em;  /* CJK-style first-line indent */
        }

        /* Override indent for paragraphs that start with images, etc. */
        .novel-content p:has(img) { text-indent: 0; }

        .novel-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1.5em auto;
            border-radius: 4px;
        }

        .novel-content blockquote {
            border-left: 3px solid #c9b89a;
            padding-left: 1em;
            margin: 1em 0;
            color: #5c4d38;
            font-style: italic;
        }

        .novel-content hr {
            border: none;
            border-top: 1px solid #d9d0bd;
            margin: 2em 0;
        }

        .novel-content a { color: #8b5a2b; }

        /* Chapter transition header */
        .chapter-divider {
            text-align: center;
            margin: 3em 0 2em;
            color: #a89275;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
        }

        /* ===== Empty state ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8a7a63;
            gap: 16px;
            font-size: 1.05rem;
            text-align: center;
            padding: 20px;
        }

        .empty-state svg { opacity: 0.5; }

        /* ===== Status message ===== */
        .status-msg {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 30, 20, 0.9);
            color: #f5f1e8;
            padding: 9px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            white-space: nowrap;
        }

        .status-msg.show { opacity: 1; }

        /* ===== TOC drawer ===== */
        .toc-drawer {
            position: absolute;
            top: 0;
            right: 0;
            width: 320px;
            height: 100%;
            background: #fbf8f1;
            border-left: 1px solid #d9d0bd;
            box-shadow: -8px 0 24px rgba(0,0,0,0.12);
            transform: translateX(100%);
            transition: transform 0.25s ease;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }

        .toc-drawer.open { transform: translateX(0); }

        .toc-header {
            padding: 14px 18px;
            border-bottom: 1px solid #e5dcc8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #efe9dc;
        }

        .toc-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a3f30;
            font-family: 'Georgia', serif;
        }

        .toc-close {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #8a7a63;
            line-height: 1;
            padding: 0 6px;
            border-radius: 6px;
        }

        .toc-close:hover { background: #e5dcc8; color: #4a3f30; }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .toc-item {
            padding: 11px 20px;
            font-size: 0.9rem;
            color: #4a3f30;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background 0.12s, border-color 0.12s;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-family: 'Georgia', serif;
        }

        .toc-item:hover { background: #f0e9d8; }

        .toc-item.active {
            background: #f0e9d8;
            border-left-color: #7a5c3e;
            font-weight: 600;
            color: #2a241c;
        }

        .toc-item .toc-label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toc-item .toc-num {
            font-size: 0.75rem;
            color: #a89275;
            background: #f0e9d8;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .drawer-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            z-index: 15;
        }

        .drawer-overlay.show { opacity: 1; pointer-events: auto; }

        .toolbar button.active {
            background: #7a5c3e;
            color: #fff8ec;
            border-color: #7a5c3e;
        }

        /* Scrollbar styling */
        #viewer::-webkit-scrollbar,
        .toc-list::-webkit-scrollbar { width: 10px; }

        #viewer::-webkit-scrollbar-track,
        .toc-list::-webkit-scrollbar-track { background: transparent; }

        #viewer::-webkit-scrollbar-thumb,
        .toc-list::-webkit-scrollbar-thumb {
            background: #d9d0bd;
            border-radius: 10px;
            border: 2px solid #f5f1e8;
        }

        #viewer::-webkit-scrollbar-thumb:hover,
        .toc-list::-webkit-scrollbar-thumb:hover { background: #b8a98c; }

        /* Reading progress bar */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background: #7a5c3e;
            width: 0%;
            transition: width 0.1s;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="reader-container">
        <div class="progress-bar" id="progressBar"></div>

        <div class="toolbar">
            <label class="file-label">
                📂 Open EPUB
                <input type="file" id="fileInput" accept=".epub,application/epub+zip">
            </label>
            <button id="prevBtn" disabled>◀ Prev</button>
            <button id="nextBtn" disabled>Next ▶</button>
            <button id="tocBtn" disabled>📖 Chapters</button>
            <div class="spacer"></div>
            <span class="chapter-info" id="chapterInfo">—</span>
        </div>

        <div id="viewer">
            <div class="empty-state" id="emptyState">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
                <p>No book loaded.<br>Open an EPUB file to start reading.</p>
            </div>
        </div>

        <div class="drawer-overlay" id="drawerOverlay"></div>

        <div class="toc-drawer" id="tocDrawer">
            <div class="toc-header">
                <h3>Chapters</h3>
                <button class="toc-close" id="closeTocBtn" title="Close">×</button>
            </div>
            <div class="toc-list" id="tocList"></div>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        (function(){
            // ============================================================
            // 1. MINIMAL ZIP READER (uses native DecompressionStream)
            // ============================================================
            async function unzip(arrayBuffer) {
                const view = new DataView(arrayBuffer);
                const bytes = new Uint8Array(arrayBuffer);

                // Find End of Central Directory (EOCD) signature: 0x06054b50
                let eocdOffset = -1;
                for (let i = bytes.length - 22; i >= 0; i--) {
                    if (view.getUint32(i, true) === 0x06054b50) {
                        eocdOffset = i;
                        break;
                    }
                }
                if (eocdOffset === -1) throw new Error('Not a valid ZIP file');

                const cdOffset = view.getUint32(eocdOffset + 16, true);
                const cdSize   = view.getUint32(eocdOffset + 12, true);
                const cdCount  = view.getUint16(eocdOffset + 10, true);

                const files = {}; // path -> { method, compressedSize, uncompressedSize, dataOffset }

                let p = cdOffset;
                for (let i = 0; i < cdCount; i++) {
                    if (view.getUint32(p, true) !== 0x02014b50) break; // Central dir header sig

                    const method          = view.getUint16(p + 10, true);
                    const compressedSize  = view.getUint32(p + 20, true);
                    const uncompressedSize= view.getUint32(p + 24, true);
                    const nameLen         = view.getUint16(p + 28, true);
                    const extraLen        = view.getUint16(p + 30, true);
                    const commentLen      = view.getUint16(p + 32, true);
                    const localOffset     = view.getUint32(p + 42, true);

                    const name = new TextDecoder('utf-8').decode(bytes.subarray(p + 46, p + 46 + nameLen));

                    // Read the local file header at localOffset to get real data start
                    const localNameLen  = view.getUint16(localOffset + 26, true);
                    const localExtraLen = view.getUint16(localOffset + 28, true);
                    const dataOffset    = localOffset + 30 + localNameLen + localExtraLen;

                    files[name] = { method, compressedSize, uncompressedSize, dataOffset };

                    p += 46 + nameLen + extraLen + commentLen;
                }

                return { files, bytes, view };
            }

            async function readZipEntry(zip, path) {
                const entry = zip.files[path];
                if (!entry) return null;

                const raw = zip.bytes.subarray(entry.dataOffset, entry.dataOffset + entry.compressedSize);

                if (entry.method === 0) {
                    // Stored — no compression
                    return raw;
                }
                if (entry.method === 8) {
                    // Deflate — use native DecompressionStream
                    const ds = new DecompressionStream('deflate-raw');
                    const stream = new Blob([raw]).stream().pipeThrough(ds);
                    const buf = await new Response(stream).arrayBuffer();
                    return new Uint8Array(buf);
                }
                throw new Error('Unsupported compression method: ' + entry.method);
            }

            async function readZipText(zip, path) {
                const data = await readZipEntry(zip, path);
                if (!data) return null;
                return new TextDecoder('utf-8').decode(data);
            }

            // ============================================================
            // 2. EPUB PARSER
            // ============================================================
            async function parseEpub(arrayBuffer) {
                const zip = await unzip(arrayBuffer);

                // Find META-INF/container.xml
                const containerXml = await readZipText(zip, 'META-INF/container.xml');
                if (!containerXml) throw new Error('Not an EPUB: missing container.xml');

                const containerDoc = new DOMParser().parseFromString(containerXml, 'application/xml');
                const rootfileEl = containerDoc.querySelector('rootfile');
                if (!rootfileEl) throw new Error('No rootfile in container.xml');
                const opfPath = rootfileEl.getAttribute('full-path');

                const opfDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
                const opfXml = await readZipText(zip, opfPath);
                if (!opfXml) throw new Error('Cannot read OPF: ' + opfPath);

                const opfDoc = new DOMParser().parseFromString(opfXml, 'application/xml');

                // --- Metadata ---
                const titleEl = opfDoc.querySelector('metadata > title') || opfDoc.getElementsByTagName('dc:title')[0];
                const title = titleEl ? titleEl.textContent.trim() : 'Untitled';

                const authorEl = opfDoc.getElementsByTagName('dc:creator')[0];
                const author = authorEl ? authorEl.textContent.trim() : '';

                // --- Manifest ---
                const manifest = {};
                opfDoc.querySelectorAll('manifest > item').forEach(item => {
                    const id   = item.getAttribute('id');
                    const href = item.getAttribute('href');
                    const type = item.getAttribute('media-type');
                    if (id && href) manifest[id] = { href, type };
                });

                // --- Spine (reading order) ---
                const spine = [];
                opfDoc.querySelectorAll('spine > itemref').forEach(ref => {
                    const idref = ref.getAttribute('idref');
                    if (idref && manifest[idref]) {
                        spine.push({ idref, href: manifest[idref].href });
                    }
                });

                // --- TOC (NCX or Nav) ---
                let toc = [];
                const ncxId = opfDoc.querySelector('spine')?.getAttribute('toc');
                if (ncxId && manifest[ncxId]) {
                    toc = await parseNcx(zip, opfDir + manifest[ncxId].href);
                } else {
                    // Try nav doc (EPUB3)
                    const navItem = Object.values(manifest).find(m =>
                        m.type === 'application/xhtml+xml' &&
                        (m.href.includes('nav') || m.href.includes('toc'))
                    );
                    if (navItem) {
                        toc = await parseNav(zip, opfDir + navItem.href);
                    }
                }

                // If no TOC found, build from spine
                if (toc.length === 0) {
                    toc = spine.map((s, i) => ({
                        label: `Chapter ${i + 1}`,
                        href: s.href
                    }));
                }

                return { zip, opfDir, title, author, manifest, spine, toc };
            }

            async function parseNcx(zip, ncxPath) {
                const xml = await readZipText(zip, ncxPath);
                if (!xml) return [];
                const doc = new DOMParser().parseFromString(xml, 'application/xml');
                const navMap = doc.querySelector('navMap');
                if (!navMap) return [];
                return parseNavPoints(navMap);
            }

            function parseNavPoints(parent) {
                const items = [];
                parent.querySelectorAll(':scope > navPoint').forEach(np => {
                    const labelEl = np.querySelector('navLabel > text');
                    const contentEl = np.querySelector('content');
                    if (labelEl && contentEl) {
                        items.push({
                            label: labelEl.textContent.trim(),
                            href: contentEl.getAttribute('src')
                        });
                    }
                });
                return items;
            }

            async function parseNav(zip, navPath) {
                const xml = await readZipText(zip, navPath);
                if (!xml) return [];
                const doc = new DOMParser().parseFromString(xml, 'application/xhtml+xml');
                const items = [];
                doc.querySelectorAll('nav[epub\\:type="toc"] a, nav[role="doc-toc"] a').forEach(a => {
                    items.push({
                        label: a.textContent.trim(),
                        href: a.getAttribute('href')
                    });
                });
                return items;
            }

            // ============================================================
            // 3. CONTENT RESOLUTION (rewrite links & images)
            // ============================================================
            async function resolveChapter(zip, chapterPath, opfDir) {
                const html = await readZipText(zip, chapterPath);
                if (!html) return null;

                // Chapter directory (relative to OPF dir)
                const chapterDir = chapterPath.includes('/')
                    ? chapterPath.slice(0, chapterPath.lastIndexOf('/') + 1)
                    : '';

                const doc = new DOMParser().parseFromString(html, 'application/xhtml+xml');

                // Extract body
                const body = doc.body;
                if (!body) return null;

                // Handle images: replace src with data URLs
                const imgs = body.querySelectorAll('img, image');
                for (const img of imgs) {
                    let src = img.getAttribute('src') || img.getAttribute('xlink:href');
                    if (!src) continue;
                    // Skip absolute URLs
                    if (/^(https?:|data:)/i.test(src)) continue;

                    // Decode URI components (e.g. %20)
                    src = decodeURIComponent(src.split('#')[0]);
                    const imgPath = chapterDir + src;
                    const data = await readZipEntry(zip, imgPath);
                    if (data) {
                        // Determine MIME
                        const ext = imgPath.split('.').pop().toLowerCase();
                        const mime = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png',
                                       gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' }[ext] || 'image/jpeg';
                        // Build base64
                        let binary = '';
                        const chunkSize = 0x8000;
                        for (let i = 0; i < data.length; i += chunkSize) {
                            binary += String.fromCharCode.apply(null, data.subarray(i, i + chunkSize));
                        }
                        const b64 = btoa(binary);
                        const dataUrl = `data:${mime};base64,${b64}`;
                        if (img.hasAttribute('src')) img.setAttribute('src', dataUrl);
                        if (img.hasAttribute('xlink:href')) img.setAttribute('xlink:href', dataUrl);
                    } else {
                        // Missing image — hide it
                        img.remove();
                    }
                }

                // Remove scripts, styles, links we don't want
                body.querySelectorAll('script, link[rel="stylesheet"], style').forEach(el => el.remove());

                return body.innerHTML;
            }

            // ============================================================
            // 4. STATE
            // ============================================================
            const fileInput     = document.getElementById('fileInput');
            const prevBtn       = document.getElementById('prevBtn');
            const nextBtn       = document.getElementById('nextBtn');
            const tocBtn        = document.getElementById('tocBtn');
            const chapterInfo   = document.getElementById('chapterInfo');
            const viewerEl      = document.getElementById('viewer');
            const emptyState    = document.getElementById('emptyState');
            const statusMsg     = document.getElementById('statusMsg');
            const tocDrawer     = document.getElementById('tocDrawer');
            const tocList       = document.getElementById('tocList');
            const closeTocBtn   = document.getElementById('closeTocBtn');
            const drawerOverlay = document.getElementById('drawerOverlay');
            const progressBar   = document.getElementById('progressBar');

            let epubData = null;    // { zip, opfDir, title, author, manifest, spine, toc }
            let currentIndex = 0;   // index into epubData.spine
            let tocHrefMap = {};    // href -> spine index

            function showMessage(text, duration = 2200) {
                statusMsg.textContent = text;
                statusMsg.classList.add('show');
                clearTimeout(window._msgTimeout);
                window._msgTimeout = setTimeout(() => statusMsg.classList.remove('show'), duration);
            }

            // ============================================================
            // 5. RENDERING
            // ============================================================
            async function renderChapter(index) {
                if (!epubData || index < 0 || index >= epubData.spine.length) return;
                currentIndex = index;

                const spineItem = epubData.spine[index];
                const chapterPath = epubData.opfDir + spineItem.href;

                viewerEl.innerHTML = '<div class="novel-content" id="novelContent"><p style="text-align:center;color:#8a7a63;text-indent:0;">Loading…</p></div>';

                const content = await resolveChapter(epubData.zip, chapterPath, epubData.opfDir);
                if (content === null) {
                    viewerEl.innerHTML = '<div class="novel-content"><p style="text-align:center;color:#8a7a63;text-indent:0;">Could not load chapter.</p></div>';
                    return;
                }

                const container = document.getElementById('novelContent');
                container.innerHTML = content;

                // Update chapter info (from TOC if available)
                const label = findTocLabelForSpineIndex(index);
                chapterInfo.textContent = label ? `${index + 1}/${epubData.spine.length} · ${label}` : `${index + 1}/${epubData.spine.length}`;

                // Update button states
                prevBtn.disabled = index <= 0;
                nextBtn.disabled = index >= epubData.spine.length - 1;

                // Update TOC highlight
                updateTocHighlight(index);

                // Reset scroll to top
                viewerEl.scrollTop = 0;
                updateProgress();

                // Handle internal links inside content
                container.querySelectorAll('a[href]').forEach(a => {
                    a.addEventListener('click', (e) => {
                        const href = a.getAttribute('href');
                        if (!href || /^(https?:|mailto:)/i.test(href)) return;
                        e.preventDefault();
                        const target = href.split('#')[0];
                        if (!target) return;
                        // Resolve target relative to current chapter dir
                        const chapterDir = chapterPath.includes('/')
                            ? chapterPath.slice(0, chapterPath.lastIndexOf('/') + 1)
                            : '';
                        const resolved = normalizePath(chapterDir + target);
                        // Find matching spine item
                        const idx = epubData.spine.findIndex(s =>
                            normalizePath(epubData.opfDir + s.href) === resolved
                        );
                        if (idx !== -1) renderChapter(idx);
                    });
                });
            }

            function normalizePath(p) {
                const parts = p.split('/');
                const out = [];
                for (const part of parts) {
                    if (part === '.' || part === '') continue;
                    if (part === '..') out.pop();
                    else out.push(part);
                }
                return out.join('/');
            }

            function findTocLabelForSpineIndex(spineIdx) {
                if (!epubData || !epubData.toc) return null;
                const spineItem = epubData.spine[spineIdx];
                if (!spineItem) return null;
                const spineHref = normalizePath(epubData.opfDir + spineItem.href);

                for (const tocItem of epubData.toc) {
                    if (!tocItem.href) continue;
                    const tocHref = normalizePath(epubData.opfDir + tocItem.href.split('#')[0]);
                    if (tocHref === spineHref) return tocItem.label;
                }
                return null;
            }

            // ============================================================
            // 6. TOC
            // ============================================================
            function buildToc() {
                tocList.innerHTML = '';
                if (!epubData) return;

                // Build map: normalized href -> spine index
                tocHrefMap = {};
                epubData.spine.forEach((s, i) => {
                    tocHrefMap[normalizePath(epubData.opfDir + s.href)] = i;
                });

                epubData.toc.forEach((item, i) => {
                    const el = document.createElement('div');
                    el.className = 'toc-item';
                    el.dataset.index = i;

                    const label = document.createElement('span');
                    label.className = 'toc-label';
                    label.textContent = item.label || `Chapter ${i + 1}`;

                    const num = document.createElement('span');
                    num.className = 'toc-num';
                    num.textContent = `#${i + 1}`;

                    el.appendChild(label);
                    el.appendChild(num);

                    el.addEventListener('click', () => {
                        const href = item.href ? normalizePath(epubData.opfDir + item.href.split('#')[0]) : null;
                        const spineIdx = href ? tocHrefMap[href] : -1;
                        if (spineIdx !== undefined && spineIdx !== -1) {
                            renderChapter(spineIdx);
                            closeToc();
                        } else {
                            // Fallback: try to find by partial match
                            showMessage('⚠️ Chapter not found in spine.');
                        }
                    });

                    tocList.appendChild(el);
                });

                updateTocHighlight(currentIndex);
            }

            function updateTocHighlight(spineIdx) {
                if (!epubData) return;
                const currentSpine = epubData.spine[spineIdx];
                if (!currentSpine) return;
                const currentHref = normalizePath(epubData.opfDir + currentSpine.href);

                let activeTocIdx = -1;
                epubData.toc.forEach((item, i) => {
                    if (!item.href) return;
                    const href = normalizePath(epubData.opfDir + item.href.split('#')[0]);
                    if (href === currentHref) activeTocIdx = i;
                });

                tocList.querySelectorAll('.toc-item').forEach(el => {
                    el.classList.toggle('active', parseInt(el.dataset.index) === activeTocIdx);
                });
            }

            function openToc() {
                tocDrawer.classList.add('open');
                drawerOverlay.classList.add('show');
                tocBtn.classList.add('active');
            }

            function closeToc() {
                tocDrawer.classList.remove('open');
                drawerOverlay.classList.remove('show');
                tocBtn.classList.remove('active');
            }

            function toggleToc() {
                if (tocDrawer.classList.contains('open')) closeToc();
                else openToc();
            }

            tocBtn.addEventListener('click', toggleToc);
            closeTocBtn.addEventListener('click', closeToc);
            drawerOverlay.addEventListener('click', closeToc);

            // ============================================================
            // 7. LOAD EPUB
            // ============================================================
            async function loadEpubFile(arrayBuffer) {
                try {
                    showMessage('📖 Parsing EPUB…', 4000);
                    viewerEl.innerHTML = '<div class="empty-state"><p>Parsing…</p></div>';

                    epubData = await parseEpub(arrayBuffer);

                    emptyState.style.display = 'none';

                    // Enable buttons
                    tocBtn.disabled = false;

                    buildToc();
                    await renderChapter(0);

                    showMessage(`📚 "${epubData.title}" loaded`, 2500);
                } catch (err) {
                    console.error(err);
                    showMessage('❌ Error: ' + err.message, 4000);
                    viewerEl.innerHTML = `
                        <div class="empty-state">
                            <p style="color:#b04a4a;">Failed to load EPUB<br><small>${err.message}</small></p>
                        </div>`;
                    epubData = null;
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    tocBtn.disabled = true;
                    chapterInfo.textContent = '—';
                }
            }

            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.name.toLowerCase().endsWith('.epub')) {
                    showMessage('⚠️ Please choose an .epub file.');
                    fileInput.value = '';
                    return;
                }
                const buf = await file.arrayBuffer();
                await loadEpubFile(buf);
                fileInput.value = '';
            });

            // ============================================================
            // 8. NAVIGATION
            // ============================================================
            prevBtn.addEventListener('click', () => {
                if (epubData && currentIndex > 0) renderChapter(currentIndex - 1);
            });

            nextBtn.addEventListener('click', () => {
                if (epubData && currentIndex < epubData.spine.length - 1) renderChapter(currentIndex + 1);
            });

            // Arrow keys for chapter navigation (only when viewer is scrollable at top/bottom or no scroll)
            window.addEventListener('keydown', (e) => {
                if (!epubData) return;
                const tag = (e.target.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea') return;
                if (tocDrawer.classList.contains('open')) {
                    if (e.key === 'Escape') closeToc();
                    return;
                }

                if (e.key === 'ArrowLeft') {
                    if (currentIndex > 0) renderChapter(currentIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    if (currentIndex < epubData.spine.length - 1) renderChapter(currentIndex + 1);
                }
            });

            // ============================================================
            // 9. READING PROGRESS
            // ============================================================
            function updateProgress() {
                if (!viewerEl) return;
                const max = viewerEl.scrollHeight - viewerEl.clientHeight;
                const pct = max > 0 ? (viewerEl.scrollTop / max) * 100 : 0;
                progressBar.style.width = pct + '%';
            }

            viewerEl.addEventListener('scroll', updateProgress, { passive: true });

            // Initial
            emptyState.style.display = 'flex';
            chapterInfo.textContent = '—';
        })();
    </script>
</body>
</html>
