<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Compressor · FFmpeg.wasm</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0b0d12;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #151a22;
      border-radius: 28px;
      padding: 28px 32px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
      border: 1px solid #2a313c;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
      color: #f0f4fc;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 span {
      background: #2b7aff;
      font-size: 14px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 40px;
      color: white;
      letter-spacing: 0.2px;
    }
    .sub {
      color: #8f9bb3;
      margin: 0 0 28px;
      font-size: 15px;
      border-left: 3px solid #2b7aff;
      padding-left: 14px;
    }
    .file-area {
      background: #0e1219;
      border-radius: 18px;
      padding: 22px 24px;
      border: 1px solid #262e3b;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .file-area:hover {
      border-color: #3e4a5c;
    }
    .label {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #7f8b9f;
      margin-bottom: 8px;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px 14px;
      background: #1c2330;
      border: 1px solid #2f3a4a;
      border-radius: 12px;
      color: #eef3fd;
      font-size: 15px;
      cursor: pointer;
    }
    input[type="file"]::file-selector-button {
      background: #2b7aff;
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      color: white;
      font-weight: 500;
      margin-right: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    input[type="file"]::file-selector-button:hover {
      background: #1e62d0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 20px 0 8px;
    }
    .stat-item {
      background: #0e1219;
      border-radius: 14px;
      padding: 14px 18px;
      border: 1px solid #232c38;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      color: #6e7b91;
      letter-spacing: 0.3px;
      margin-bottom: 5px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #eef3fd;
      word-break: break-word;
    }
    .controls {
      background: #0e1219;
      border-radius: 20px;
      padding: 22px 24px;
      margin: 18px 0 24px;
      border: 1px solid #232c38;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }
    .control-row:last-child {
      margin-bottom: 0;
    }
    .control-label {
      width: 130px;
      font-size: 15px;
      font-weight: 500;
      color: #cbd5e6;
      flex-shrink: 0;
    }
    .control-input {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    select {
      width: 100%;
      padding: 12px 16px;
      background: #1c2330;
      border: 1px solid #2f3a4a;
      border-radius: 12px;
      color: #eef3fd;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238f9bb3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 18px;
      padding-right: 44px;
      transition: border-color 0.2s;
    }
    select:hover {
      border-color: #3e4a5c;
    }
    select:focus {
      outline: none;
      border-color: #2b7aff;
    }
    select option {
      background: #1c2330;
      color: #eef3fd;
    }
    .bitrate-info {
      background: #131b26;
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid #1f2a38;
    }
    .bitrate-info-label {
      font-size: 13px;
      color: #7f8b9f;
      font-weight: 500;
    }
    .bitrate-info-value {
      font-size: 15px;
      font-weight: 600;
      color: #7bb3ff;
    }
    .estimate-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0e1219;
      border-radius: 18px;
      padding: 18px 24px;
      margin: 20px 0 16px;
      border: 1px solid #2a3442;
      flex-wrap: wrap;
      gap: 12px;
    }
    .estimate-item {
      display: flex;
      flex-direction: column;
    }
    .estimate-label {
      font-size: 13px;
      color: #7b879b;
      letter-spacing: 0.2px;
      margin-bottom: 2px;
    }
    .estimate-number {
      font-size: 22px;
      font-weight: 700;
      color: #eef3fd;
      line-height: 1.2;
    }
    .estimate-number.diff {
      color: #66d9a0;
    }
    .estimate-number.diff.negative {
      color: #ff7b7b;
    }
    .estimate-number small {
      font-size: 13px;
      font-weight: 500;
      color: #7f8b9f;
      margin-left: 6px;
    }
    .convert-btn {
      width: 100%;
      background: #2b7aff;
      border: none;
      border-radius: 60px;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
      border: 1px solid #3b6ed6;
      box-shadow: 0 8px 18px rgba(43, 122, 255, 0.25);
    }
    .convert-btn:hover:not(:disabled) {
      background: #1e62d0;
      box-shadow: 0 12px 24px rgba(43, 122, 255, 0.35);
      transform: translateY(-1px);
    }
    .convert-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .progress-container {
      margin-top: 16px;
      background: #0e1219;
      border-radius: 40px;
      height: 8px;
      overflow: hidden;
      border: 1px solid #1f2835;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2b7aff, #6aa6ff);
      transition: width 0.15s ease;
      border-radius: 40px;
    }
    .status {
      font-size: 14px;
      color: #9aa8bf;
      margin-top: 10px;
      text-align: center;
      min-height: 22px;
    }
    .output-area {
      margin-top: 20px;
    }
    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e2a3a;
      border-radius: 60px;
      padding: 14px 26px;
      color: #7bb3ff;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #2b7aff33;
      transition: 0.15s;
      width: 100%;
      font-size: 16px;
    }
    .download-link:hover {
      background: #25354a;
      color: #a5c9ff;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    Video Compressor
    <span>ffmpeg.wasm</span>
  </h1>
  <p class="sub">Reduce video size · client-side · no upload</p>

  <!-- file selection -->
  <div class="file-area">
    <div class="label">Select video</div>
    <input type="file" id="videoInput" accept="video/*">
  </div>

  <!-- stats -->
  <div id="statsSection" class="hidden">
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">File size</div>
        <div class="stat-value" id="fileSizeStat">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Bitrate</div>
        <div class="stat-value" id="bitrateStat">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Resolution</div>
        <div class="stat-value" id="resolutionStat">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Duration</div>
        <div class="stat-value" id="durationStat">—</div>
      </div>
    </div>
  </div>

  <!-- controls -->
  <div id="controlsSection" class="hidden">
    <div class="controls">
      <div class="control-row">
        <div class="control-label">Target resolution</div>
        <div class="control-input">
          <select id="resolutionSelect">
            <option value="360">360p (640×360)</option>
            <option value="480">480p (854×480)</option>
            <option value="720" selected>720p (1280×720)</option>
            <option value="1080">1080p (1920×1080)</option>
          </select>
        </div>
      </div>
      <div class="bitrate-info">
        <span class="bitrate-info-label">Auto bitrate (optimized)</span>
        <span class="bitrate-info-value" id="autoBitrateValue">—</span>
      </div>
    </div>

    <!-- estimation: only video estimated size -->
    <div class="estimate-box">
      <div class="estimate-item">
        <span class="estimate-label">Original size</span>
        <span class="estimate-number" id="origSizeValue">—</span>
      </div>
      <div class="estimate-item">
        <span class="estimate-label">Estimated new size</span>
        <span class="estimate-number" id="newSizeValue">—</span>
      </div>
      <div class="estimate-item">
        <span class="estimate-label">Difference</span>
        <span class="estimate-number diff" id="diffValue">—</span>
      </div>
    </div>

    <!-- convert -->
    <button class="convert-btn" id="convertBtn" disabled>
      <span>⚡</span> Convert video
    </button>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status" id="statusMessage"></div>

    <!-- output download -->
    <div id="outputArea" class="output-area hidden">
      <a id="downloadLink" class="download-link" href="#" download="compressed_video.mp4">
        ⬇ Download compressed video
      </a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.12.15/umd/ffmpeg.min.js"></script>
<script>
  (function(){
    // DOM elements
    const videoInput = document.getElementById('videoInput');
    const statsSection = document.getElementById('statsSection');
    const controlsSection = document.getElementById('controlsSection');
    const fileSizeStat = document.getElementById('fileSizeStat');
    const bitrateStat = document.getElementById('bitrateStat');
    const resolutionStat = document.getElementById('resolutionStat');
    const durationStat = document.getElementById('durationStat');
    const resolutionSelect = document.getElementById('resolutionSelect');
    const autoBitrateValue = document.getElementById('autoBitrateValue');
    const origSizeValue = document.getElementById('origSizeValue');
    const newSizeValue = document.getElementById('newSizeValue');
    const diffValue = document.getElementById('diffValue');
    const convertBtn = document.getElementById('convertBtn');
    const progressBar = document.getElementById('progressBar');
    const statusMessage = document.getElementById('statusMessage');
    const outputArea = document.getElementById('outputArea');
    const downloadLink = document.getElementById('downloadLink');

    // state
    let selectedFile = null;
    let videoMetadata = {
      duration: 0,
      width: 0,
      height: 0,
      bitrate: 0,
      size: 0,
    };
    let ffmpeg = null;
    let isConverting = false;
    let currentObjectUrl = null;

    // ---------- Efficient bitrate table (bits per pixel per second) ----------
    // These values are based on H.264 (libx264) with 'fast' preset, targeting
    // good quality (~CRF 22-24). Expressed in bits per pixel per second (bpp).
    // Lower bpp = smaller file, higher bpp = better quality.
    // Values empirically chosen for a good size/quality tradeoff.
    const BPP_TABLE = {
      360:  0.08,   // ~ 0.08 bpp  → ~ 250 kbps for 640x360
      480:  0.085,  // ~ 0.085 bpp → ~ 500 kbps for 854x480
      720:  0.09,   // ~ 0.09 bpp  → ~ 1.2 Mbps for 1280x720
      1080: 0.095,  // ~ 0.095 bpp → ~ 2.7 Mbps for 1920x1080
    };

    // Standard widths for each target height (16:9)
    const STD_WIDTHS = {
      360: 640,
      480: 854,
      720: 1280,
      1080: 1920,
    };

    // ---------- helpers ----------
    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(Math.abs(bytes)) / Math.log(k));
      return (bytes < 0 ? '−' : '') + parseFloat((Math.abs(bytes) / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function formatBitrate(bps) {
      if (!bps || bps <= 0) return '—';
      if (bps >= 1_000_000) return (bps / 1_000_000).toFixed(2) + ' Mbps';
      if (bps >= 1_000) return (bps / 1_000).toFixed(0) + ' kbps';
      return bps + ' bps';
    }

    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return '—';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return [h, m, s].map(v => v.toString().padStart(2, '0')).join(':');
    }

    // Compute optimized bitrate for a target resolution using bpp model.
    // Also enforce a max bitrate based on the original bitrate so we never
    // increase the size beyond the original (unless user is upscaling).
    function computeAutoBitrate(targetHeight) {
      const stdWidth = STD_WIDTHS[targetHeight] || Math.round(targetHeight * 16 / 9);
      const pixels = stdWidth * targetHeight;
      const bpp = BPP_TABLE[targetHeight] || 0.09;
      let bitrate = pixels * bpp;

      // Clamp to sensible bounds (200 kbps – 15 Mbps)
      bitrate = Math.max(200_000, Math.min(15_000_000, bitrate));

      // If original bitrate is known and smaller than computed, cap it
      // so we never produce a larger file than the original.
      if (videoMetadata.bitrate > 0) {
        bitrate = Math.min(bitrate, videoMetadata.bitrate);
      }

      return Math.round(bitrate);
    }

    // Estimate new file size based on auto bitrate and duration
    function estimateNewSize(targetHeight) {
      if (!videoMetadata.duration) return 0;
      const bitrate = computeAutoBitrate(targetHeight);
      return (bitrate * videoMetadata.duration) / 8;
    }

    function resolutionLabel(height) {
      const map = { 240: '240p', 360: '360p', 480: '480p', 720: '720p', 1080: '1080p', 1440: '1440p', 2160: '4K' };
      return map[height] || `${height}p`;
    }

    // Update all UI estimates based on current resolution selection
    function updateEstimates() {
      if (!selectedFile || !videoMetadata.duration) return;

      const targetHeight = parseInt(resolutionSelect.value, 10);
      const origSize = videoMetadata.size;
      const newSize = estimateNewSize(targetHeight);
      const autoBitrate = computeAutoBitrate(targetHeight);

      // Update auto bitrate display
      autoBitrateValue.textContent = formatBitrate(autoBitrate);

      // Update size estimates
      origSizeValue.textContent = formatBytes(origSize);
      newSizeValue.textContent = formatBytes(newSize);

      const diffBytes = newSize - origSize;
      const diffAbs = Math.abs(diffBytes);

      if (diffBytes < 0) {
        diffValue.textContent = '−' + formatBytes(diffAbs);
        diffValue.classList.remove('negative');
      } else if (diffBytes > 0) {
        diffValue.textContent = '+' + formatBytes(diffAbs);
        diffValue.classList.add('negative');
      } else {
        diffValue.textContent = '± 0 B';
        diffValue.classList.remove('negative');
      }
    }

    // reset UI after new file
    function resetUI() {
      statsSection.classList.add('hidden');
      controlsSection.classList.add('hidden');
      outputArea.classList.add('hidden');
      convertBtn.disabled = true;
      statusMessage.textContent = '';
      progressBar.style.width = '0%';
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
      downloadLink.href = '#';
    }

    // load metadata using video element
    function loadVideoMetadata(file) {
      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        const url = URL.createObjectURL(file);
        video.src = url;

        video.onloadedmetadata = () => {
          const duration = video.duration;
          const width = video.videoWidth;
          const height = video.videoHeight;
          URL.revokeObjectURL(url);

          const sizeBits = file.size * 8;
          const bitrateBps = duration > 0 ? sizeBits / duration : 0;

          resolve({
            duration,
            width,
            height,
            bitrate: bitrateBps,
            size: file.size,
          });
        };
        video.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Could not load video metadata'));
        };
      });
    }

    // ---------- ffmpeg setup ----------
    async function initFFmpeg() {
      if (ffmpeg) return ffmpeg;
      statusMessage.textContent = 'Loading FFmpeg...';

      // Fix: In ffmpeg.wasm 0.12.x, the UMD build exposes FFmpeg directly on window.
      const FFmpegClass = window.FFmpeg && window.FFmpeg.FFmpeg
        ? window.FFmpeg.FFmpeg
        : window.FFmpeg;

      if (!FFmpegClass) {
        throw new Error('FFmpeg library not loaded. Check the script tag.');
      }

      ffmpeg = new FFmpegClass();
      ffmpeg.on('log', ({ message }) => { /* console.log(message) */ });
      ffmpeg.on('progress', ({ progress }) => {
        const percent = Math.min(100, Math.round(progress * 100));
        progressBar.style.width = percent + '%';
        statusMessage.textContent = `Converting... ${percent}%`;
      });

      await ffmpeg.load({
        coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
        wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
      });

      statusMessage.textContent = 'FFmpeg ready';
      return ffmpeg;
    }

    // ---------- convert ----------
    async function convertVideo() {
      if (!selectedFile || isConverting) return;
      isConverting = true;
      convertBtn.disabled = true;
      outputArea.classList.add('hidden');
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      try {
        const ff = await initFFmpeg();

        statusMessage.textContent = 'Reading file...';
        const fileData = new Uint8Array(await selectedFile.arrayBuffer());
        const inputName = 'input.' + (selectedFile.name.split('.').pop() || 'mp4');
        await ff.writeFile(inputName, fileData);

        const targetHeight = parseInt(resolutionSelect.value, 10);
        const targetWidth = STD_WIDTHS[targetHeight] || Math.round(targetHeight * 16 / 9);
        const targetBitrateBps = computeAutoBitrate(targetHeight);

        const outputName = 'output.mp4';

        // Efficient H.264 encoding settings:
        // - CRF 23 for constant quality baseline
        // - maxrate/bufsize to cap peak bitrate
        // - faststart for streaming
        const args = [
          '-i', inputName,
          '-vf', `scale=${targetWidth}:${targetHeight}`,
          '-c:v', 'libx264',
          '-preset', 'fast',
          '-crf', '23',
          '-maxrate', `${targetBitrateBps}`,
          '-bufsize', `${targetBitrateBps * 2}`,
          '-c:a', 'aac',
          '-b:a', '128k',
          '-movflags', '+faststart',
          outputName
        ];

        statusMessage.textContent = 'Starting conversion...';
        progressBar.style.width = '0%';

        await ff.exec(args);

        const outputData = await ff.readFile(outputName);
        const outputBlob = new Blob([outputData.buffer], { type: 'video/mp4' });

        currentObjectUrl = URL.createObjectURL(outputBlob);
        downloadLink.href = currentObjectUrl;
        const baseName = selectedFile.name.replace(/\.[^/.]+$/, '');
        downloadLink.download = `${baseName}_${targetHeight}p.mp4`;
        outputArea.classList.remove('hidden');
        statusMessage.textContent = '✅ Conversion complete!';
        progressBar.style.width = '100%';

        await ff.deleteFile(inputName);
        await ff.deleteFile(outputName);
      } catch (err) {
        console.error(err);
        statusMessage.textContent = '❌ Error: ' + (err.message || 'Conversion failed');
      } finally {
        isConverting = false;
        convertBtn.disabled = false;
      }
    }

    // ---------- event listeners ----------
    videoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      resetUI();
      selectedFile = file;

      try {
        const meta = await loadVideoMetadata(file);
        videoMetadata = meta;

        fileSizeStat.textContent = formatBytes(meta.size);
        bitrateStat.textContent = formatBitrate(meta.bitrate);
        resolutionStat.textContent = meta.width && meta.height ? `${meta.width}×${meta.height}` : '—';
        durationStat.textContent = formatDuration(meta.duration);

        // Auto-select a sensible default resolution based on original height.
        // Choose the largest standard resolution that does not exceed the original.
        const origHeight = meta.height || 720;
        let defaultHeight = 720;
        if (origHeight >= 1080) defaultHeight = 1080;
        else if (origHeight >= 720) defaultHeight = 720;
        else if (origHeight >= 480) defaultHeight = 480;
        else defaultHeight = 360;
        resolutionSelect.value = defaultHeight;

        statsSection.classList.remove('hidden');
        controlsSection.classList.remove('hidden');

        updateEstimates();
        convertBtn.disabled = false;
      } catch (err) {
        console.error(err);
        statusMessage.textContent = 'Could not read video metadata.';
        statsSection.classList.add('hidden');
        controlsSection.classList.add('hidden');
      }
    });

    resolutionSelect.addEventListener('change', updateEstimates);
    convertBtn.addEventListener('click', convertVideo);

    window.addEventListener('beforeunload', () => {
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    });
  })();
</script>
</body>
</html>
