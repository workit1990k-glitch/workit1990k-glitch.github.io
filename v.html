<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Compressor · FFmpeg.wasm</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0b0d12;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #151a22;
      border-radius: 28px;
      padding: 28px 32px;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
      border: 1px solid #2a313c;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
      color: #f0f4fc;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 span {
      background: #2b7aff;
      font-size: 14px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 40px;
      color: white;
      letter-spacing: 0.2px;
    }
    .sub {
      color: #8f9bb3;
      margin: 0 0 28px;
      font-size: 15px;
      border-left: 3px solid #2b7aff;
      padding-left: 14px;
    }
    .file-area {
      background: #0e1219;
      border-radius: 18px;
      padding: 22px 24px;
      border: 1px solid #262e3b;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .file-area:hover {
      border-color: #3e4a5c;
    }
    .label {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #7f8b9f;
      margin-bottom: 8px;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px 14px;
      background: #1c2330;
      border: 1px solid #2f3a4a;
      border-radius: 12px;
      color: #eef3fd;
      font-size: 15px;
      cursor: pointer;
    }
    input[type="file"]::file-selector-button {
      background: #2b7aff;
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      color: white;
      font-weight: 500;
      margin-right: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    input[type="file"]::file-selector-button:hover {
      background: #1e62d0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 20px 0 8px;
    }
    .stat-item {
      background: #0e1219;
      border-radius: 14px;
      padding: 14px 18px;
      border: 1px solid #232c38;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      color: #6e7b91;
      letter-spacing: 0.3px;
      margin-bottom: 5px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #eef3fd;
      word-break: break-word;
    }
    .stat-value small {
      font-size: 14px;
      font-weight: 400;
      color: #8f9bb3;
      margin-left: 6px;
    }
    .controls {
      background: #0e1219;
      border-radius: 20px;
      padding: 22px 24px;
      margin: 18px 0 24px;
      border: 1px solid #232c38;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }
    .control-row:last-child {
      margin-bottom: 0;
    }
    .control-label {
      width: 110px;
      font-size: 15px;
      font-weight: 500;
      color: #cbd5e6;
      flex-shrink: 0;
    }
    .control-input {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: #232c38;
      border-radius: 10px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #2b7aff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 0 3px rgba(43, 122, 255, 0.2);
      transition: 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      background: #4a8eff;
    }
    .value-badge {
      min-width: 75px;
      text-align: right;
      font-weight: 600;
      color: #eef3fd;
      font-size: 15px;
      background: #1c2330;
      padding: 5px 12px;
      border-radius: 30px;
      border: 1px solid #2c3748;
    }

    /* estimation table */
    .estimate-table {
      background: #0e1219;
      border-radius: 18px;
      border: 1px solid #2a3442;
      overflow: hidden;
      margin: 20px 0 16px;
    }
    .estimate-header {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 8px;
      padding: 12px 18px;
      background: #1a2230;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #7f8b9f;
      border-bottom: 1px solid #232c38;
    }
    .estimate-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 8px;
      padding: 14px 18px;
      align-items: center;
      border-bottom: 1px solid #1c2531;
    }
    .estimate-row:last-child {
      border-bottom: none;
    }
    .estimate-row .label-cell {
      font-size: 14px;
      font-weight: 500;
      color: #cbd5e6;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .estimate-row .label-cell .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.orig { background: #6e7b91; }
    .dot.new { background: #2b7aff; }
    .dot.diff { background: #66d9a0; }
    .dot.diff.negative { background: #ff7b7b; }

    .estimate-row .value-cell {
      font-size: 16px;
      font-weight: 600;
      color: #eef3fd;
    }
    .estimate-row .value-cell.diff {
      color: #66d9a0;
    }
    .estimate-row .value-cell.diff.negative {
      color: #ff7b7b;
    }
    .estimate-row .value-cell small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #7f8b9f;
      margin-top: 2px;
      letter-spacing: 0.1px;
    }

    .convert-btn {
      width: 100%;
      background: #2b7aff;
      border: none;
      border-radius: 60px;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
      border: 1px solid #3b6ed6;
      box-shadow: 0 8px 18px rgba(43, 122, 255, 0.25);
    }
    .convert-btn:hover:not(:disabled) {
      background: #1e62d0;
      box-shadow: 0 12px 24px rgba(43, 122, 255, 0.35);
      transform: translateY(-1px);
    }
    .convert-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .progress-container {
      margin-top: 16px;
      background: #0e1219;
      border-radius: 40px;
      height: 8px;
      overflow: hidden;
      border: 1px solid #1f2835;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2b7aff, #6aa6ff);
      transition: width 0.15s ease;
      border-radius: 40px;
    }
    .status {
      font-size: 14px;
      color: #9aa8bf;
      margin-top: 10px;
      text-align: center;
      min-height: 22px;
    }
    .output-area {
      margin-top: 20px;
    }
    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e2a3a;
      border-radius: 60px;
      padding: 14px 26px;
      color: #7bb3ff;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #2b7aff33;
      transition: 0.15s;
      width: 100%;
      font-size: 16px;
    }
    .download-link:hover {
      background: #25354a;
      color: #a5c9ff;
    }
    .hidden {
      display: none;
    }
    @media (max-width: 560px) {
      .card { padding: 22px 18px; }
      .estimate-header,
      .estimate-row {
        grid-template-columns: 1.2fr 1fr 1fr 1fr;
        padding: 10px 12px;
      }
      .estimate-row .value-cell { font-size: 14px; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    Video Compressor
    <span>ffmpeg.wasm</span>
  </h1>
  <p class="sub">Reduce video size · client-side · no upload</p>

  <!-- file selection -->
  <div class="file-area">
    <div class="label">Select video</div>
    <input type="file" id="videoInput" accept="video/*">
  </div>

  <!-- stats -->
  <div id="statsSection" class="hidden">
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">File size</div>
        <div class="stat-value" id="fileSizeStat">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Bitrate</div>
        <div class="stat-value" id="bitrateStat">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Resolution</div>
        <div class="stat-value" id="resolutionStat">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Duration</div>
        <div class="stat-value" id="durationStat">—</div>
      </div>
    </div>
  </div>

  <!-- controls -->
  <div id="controlsSection" class="hidden">
    <div class="controls">
      <div class="control-row">
        <div class="control-label">Bitrate</div>
        <div class="control-input">
          <input type="range" id="bitrateSlider" min="0.2" max="8" step="0.1" value="2">
          <div class="value-badge" id="bitrateValue">2.0 Mbps</div>
        </div>
      </div>
      <div class="control-row">
        <div class="control-label">Resolution</div>
        <div class="control-input">
          <input type="range" id="resolutionSlider" min="240" max="2160" step="1" value="720">
          <div class="value-badge" id="resolutionValue">720p</div>
        </div>
      </div>
    </div>

    <!-- estimation table: shows diff for bitrate change and resolution change separately -->
    <div class="estimate-table">
      <div class="estimate-header">
        <div>Metric</div>
        <div>Original</div>
        <div>New</div>
        <div>Difference</div>
      </div>

      <!-- Bitrate row -->
      <div class="estimate-row">
        <div class="label-cell"><span class="dot orig"></span> Bitrate</div>
        <div class="value-cell" id="origBitrateCell">—</div>
        <div class="value-cell" id="newBitrateCell">—</div>
        <div class="value-cell diff" id="bitrateDiffCell">—</div>
      </div>

      <!-- Resolution row -->
      <div class="estimate-row">
        <div class="label-cell"><span class="dot orig"></span> Resolution</div>
        <div class="value-cell" id="origResCell">—</div>
        <div class="value-cell" id="newResCell">—</div>
        <div class="value-cell diff" id="resDiffCell">—</div>
      </div>

      <!-- Total size row (highlighted) -->
      <div class="estimate-row" style="background:#131b26;">
        <div class="label-cell"><span class="dot new"></span> Est. file size</div>
        <div class="value-cell" id="origSizeCell">—</div>
        <div class="value-cell" id="newSizeCell">—</div>
        <div class="value-cell diff" id="sizeDiffCell">—</div>
      </div>
    </div>

    <!-- convert -->
    <button class="convert-btn" id="convertBtn" disabled>
      <span>⚡</span> Convert video
    </button>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status" id="statusMessage"></div>

    <!-- output download -->
    <div id="outputArea" class="output-area hidden">
      <a id="downloadLink" class="download-link" href="#" download="compressed_video.mp4">
        ⬇ Download compressed video
      </a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
<script>
  (function(){
    // DOM elements
    const videoInput = document.getElementById('videoInput');
    const statsSection = document.getElementById('statsSection');
    const controlsSection = document.getElementById('controlsSection');
    const fileSizeStat = document.getElementById('fileSizeStat');
    const bitrateStat = document.getElementById('bitrateStat');
    const resolutionStat = document.getElementById('resolutionStat');
    const durationStat = document.getElementById('durationStat');
    const bitrateSlider = document.getElementById('bitrateSlider');
    const resolutionSlider = document.getElementById('resolutionSlider');
    const bitrateValue = document.getElementById('bitrateValue');
    const resolutionValue = document.getElementById('resolutionValue');
    const convertBtn = document.getElementById('convertBtn');
    const progressBar = document.getElementById('progressBar');
    const statusMessage = document.getElementById('statusMessage');
    const outputArea = document.getElementById('outputArea');
    const downloadLink = document.getElementById('downloadLink');

    // estimate table cells
    const origBitrateCell = document.getElementById('origBitrateCell');
    const newBitrateCell = document.getElementById('newBitrateCell');
    const bitrateDiffCell = document.getElementById('bitrateDiffCell');
    const origResCell = document.getElementById('origResCell');
    const newResCell = document.getElementById('newResCell');
    const resDiffCell = document.getElementById('resDiffCell');
    const origSizeCell = document.getElementById('origSizeCell');
    const newSizeCell = document.getElementById('newSizeCell');
    const sizeDiffCell = document.getElementById('sizeDiffCell');

    // state
    let selectedFile = null;
    let videoMetadata = {
      duration: 0,
      width: 0,
      height: 0,
      bitrate: 0,      // in bits per second (bps)
      size: 0,         // bytes
    };
    let ffmpeg = null;
    let isConverting = false;
    let currentObjectUrl = null;

    // ---------- helpers ----------
    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(Math.abs(bytes)) / Math.log(k));
      return (bytes < 0 ? '−' : '') + parseFloat((Math.abs(bytes) / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function formatBitrate(bps) {
      if (!bps || bps <= 0) return '—';
      if (bps >= 1_000_000) return (bps / 1_000_000).toFixed(2) + ' Mbps';
      if (bps >= 1_000) return (bps / 1_000).toFixed(0) + ' kbps';
      return bps + ' bps';
    }

    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return '—';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return [h, m, s].map(v => v.toString().padStart(2, '0')).join(':');
    }

    // Estimate size based on bitrate (video+audio) and duration.
    function estimateSizeFromBitrate(bitrateBps, durationSec) {
      if (!bitrateBps || !durationSec || durationSec <= 0) return 0;
      // assume audio ~128 kbps included in target bitrate when user picks bitrate.
      // For simplicity, we treat the user-selected bitrate as the total target bitrate.
      return (bitrateBps * durationSec) / 8;
    }

    // Estimate size accounting for both bitrate AND resolution change.
    // Resolution change alone does NOT change file size if bitrate is constant.
    // However, lower resolution often allows lower bitrate for same quality.
    // To give the user a meaningful resolution-based estimate, we model:
    //   effectiveBitrate = targetBitrate * resolutionFactor
    // where resolutionFactor scales relative to original resolution if user
    // wants to lower bitrate further for small resolutions.
    // Actually simpler and more honest: show that resolution change alone does
    // not affect size unless bitrate changes. But we can show "recommended bitrate"
    // for a given resolution. We'll compute two separate contributions:
    //   1. bitrateDiffBytes  = (newBitrate - origBitrate) * duration / 8
    //   2. resFactor = (newPixels / origPixels), and estimate "natural" bitrate
    //      for the new resolution at same quality/bit-depth => bitrate scales with pixels.
    // But since the user is explicitly setting a target bitrate, the resolution
    // change is enforced by the scale filter but bitrate is what drives file size.
    // To make the resolution slider meaningful, we compute a "suggested bitrate"
    // for the chosen resolution based on original bits-per-pixel, and use that
    // as the effective bitrate when the user hasn't manually adjusted? No.
    // The cleanest approach: show two separate "if only this changed" scenarios,
    // plus the combined result.
    // We'll implement the combined estimate as:
    //   effectiveTargetBitrate = targetBitrateMbps * 1e6
    //   newSize = effectiveTargetBitrate * duration / 8
    // And for resolution row, we show the "recommended bitrate for this resolution"
    // and the size if that recommended bitrate were used, so user sees impact.

    // Compute recommended bitrate for a given resolution based on original
    // bits-per-pixel (bpp), then apply a compression factor (0.7) since we
    // re-encode. This gives an intuitive resolution-driven estimate.
    function recommendedBitrateForResolution(origBitrateBps, origW, origH, newH, aspect) {
      if (!origW || !origH || !origBitrateBps) return origBitrateBps;
      const origPixels = origW * origH;
      const newW = Math.round(newH * aspect / 2) * 2;
      const newPixels = newW * newH;
      // bits per pixel of original
      const bpp = origBitrateBps / origPixels;
      // assume we can keep similar bpp but with better codec efficiency (0.8)
      // this is heuristic.
      const recommended = bpp * newPixels * 0.8;
      // clamp to sensible range (0.2 – 12 Mbps)
      return Math.min(12_000_000, Math.max(200_000, recommended));
    }

    function resolutionLabel(height) {
      const map = { 240: '240p', 360: '360p', 480: '480p', 720: '720p', 1080: '1080p', 1440: '1440p', 2160: '4K' };
      const keys = Object.keys(map).map(Number);
      const closest = keys.reduce((prev, curr) => Math.abs(curr - height) < Math.abs(prev - height) ? curr : prev);
      return map[closest] || `${height}p`;
    }

    // Update all estimates
    function updateEstimates() {
      if (!selectedFile || !videoMetadata.duration) return;

      const duration = videoMetadata.duration;
      const origBitrate = videoMetadata.bitrate;           // bps
      const origSize = videoMetadata.size;                 // bytes
      const origW = videoMetadata.width;
      const origH = videoMetadata.height;
      const aspect = origW / origH;

      // current slider values
      const newBitrateMbps = parseFloat(bitrateSlider.value);
      const newBitrateBps = newBitrateMbps * 1_000_000;
      const newHeight = parseInt(resolutionSlider.value, 10);
      const newWidth = Math.round(newHeight * aspect / 2) * 2;

      // update labels
      bitrateValue.textContent = newBitrateMbps.toFixed(1) + ' Mbps';
      resolutionValue.textContent = resolutionLabel(newHeight);

      // --- Estimate new file size using target bitrate (combined effect) ---
      // Since ffmpeg will enforce target bitrate, file size ≈ bitrate * duration / 8
      let estimatedNewSize = estimateSizeFromBitrate(newBitrateBps, duration);
      // Fallback if duration/bitrate missing
      if (estimatedNewSize <= 0) estimatedNewSize = origSize * 0.7;

      // --- Fill table cells ---

      // Bitrate row
      origBitrateCell.textContent = formatBitrate(origBitrate);
      newBitrateCell.textContent = formatBitrate(newBitrateBps);
      const bitrateDiffBps = newBitrateBps - origBitrate;
      // size difference attributable to bitrate change alone
      const bitrateDiffBytes = (bitrateDiffBps * duration) / 8;
      bitrateDiffCell.textContent = (bitrateDiffBytes > 0 ? '+' : '') + formatBytes(bitrateDiffBytes);
      bitrateDiffCell.classList.toggle('negative', bitrateDiffBytes > 0);

      // Resolution row: show recommended bitrate and size for that resolution
      const recommendedBps = recommendedBitrateForResolution(origBitrate, origW, origH, newHeight, aspect);
      const recommendedSize = estimateSizeFromBitrate(recommendedBps, duration);
      origResCell.textContent = `${origW}×${origH}`;
      newResCell.innerHTML = `${newWidth}×${newHeight}<small>~${formatBitrate(recommendedBps)} rec.</small>`;
      // diff for resolution: recommendedSize - origSize
      const resDiffBytes = recommendedSize - origSize;
      resDiffCell.textContent = (resDiffBytes > 0 ? '+' : '') + formatBytes(resDiffBytes);
      resDiffCell.classList.toggle('negative', resDiffBytes > 0);

      // Total size row
      origSizeCell.textContent = formatBytes(origSize);
      newSizeCell.textContent = formatBytes(estimatedNewSize);
      const totalDiffBytes = estimatedNewSize - origSize;
      sizeDiffCell.textContent = (totalDiffBytes > 0 ? '+' : '') + formatBytes(totalDiffBytes);
      sizeDiffCell.classList.toggle('negative', totalDiffBytes > 0);

      // Also update the small note under the "New" resolution: show what the
      // file size would be if only resolution changed (using recommended bitrate)
      // That's already in resDiffCell, good.
    }

    // reset UI after new file
    function resetUI() {
      statsSection.classList.add('hidden');
      controlsSection.classList.add('hidden');
      outputArea.classList.add('hidden');
      convertBtn.disabled = true;
      statusMessage.textContent = '';
      progressBar.style.width = '0%';
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
      downloadLink.href = '#';
    }

    // load metadata using video element
    function loadVideoMetadata(file) {
      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        const url = URL.createObjectURL(file);
        video.src = url;

        video.onloadedmetadata = () => {
          const duration = video.duration;
          const width = video.videoWidth;
          const height = video.videoHeight;
          URL.revokeObjectURL(url);

          const sizeBits = file.size * 8;
          const bitrateBps = duration > 0 ? sizeBits / duration : 0;

          resolve({
            duration,
            width,
            height,
            bitrate: bitrateBps,
            size: file.size,
          });
        };
        video.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Could not load video metadata'));
        };
      });
    }

    // ---------- ffmpeg setup ----------
    async function initFFmpeg() {
      if (ffmpeg) return ffmpeg;
      statusMessage.textContent = 'Loading FFmpeg...';
      const { FFmpeg } = FFmpegWASM;
      ffmpeg = new FFmpeg();
      ffmpeg.on('log', ({ message }) => { /* console.log(message) */ });
      ffmpeg.on('progress', ({ progress }) => {
        const percent = Math.min(100, Math.round(progress * 100));
        progressBar.style.width = percent + '%';
        statusMessage.textContent = `Converting... ${percent}%`;
      });
      await ffmpeg.load({
        coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
        wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
      });
      statusMessage.textContent = 'FFmpeg ready';
      return ffmpeg;
    }

    // ---------- convert ----------
    async function convertVideo() {
      if (!selectedFile || isConverting) return;
      isConverting = true;
      convertBtn.disabled = true;
      outputArea.classList.add('hidden');
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      try {
        const ff = await initFFmpeg();

        statusMessage.textContent = 'Reading file...';
        const fileData = new Uint8Array(await selectedFile.arrayBuffer());
        const inputName = 'input.' + (selectedFile.name.split('.').pop() || 'mp4');
        await ff.writeFile(inputName, fileData);

        const targetBitrateMbps = parseFloat(bitrateSlider.value);
        const targetBitrateBps = Math.round(targetBitrateMbps * 1_000_000);
        const targetHeight = parseInt(resolutionSlider.value, 10);
        const aspect = videoMetadata.width / videoMetadata.height;
        const targetWidth = Math.round(targetHeight * aspect / 2) * 2;

        const outputName = 'output.mp4';

        const args = [
          '-i', inputName,
          '-vf', `scale=${targetWidth}:${targetHeight}`,
          '-b:v', `${targetBitrateBps}`,
          '-maxrate', `${targetBitrateBps}`,
          '-bufsize', `${targetBitrateBps * 2}`,
          '-c:v', 'libx264',
          '-preset', 'fast',
          '-c:a', 'aac',
          '-b:a', '128k',
          '-movflags', '+faststart',
          outputName
        ];

        statusMessage.textContent = 'Starting conversion...';
        progressBar.style.width = '0%';

        await ff.exec(args);

        const outputData = await ff.readFile(outputName);
        const outputBlob = new Blob([outputData.buffer], { type: 'video/mp4' });

        currentObjectUrl = URL.createObjectURL(outputBlob);
        downloadLink.href = currentObjectUrl;
        const baseName = selectedFile.name.replace(/\.[^/.]+$/, '');
        downloadLink.download = `${baseName}_compressed.mp4`;
        outputArea.classList.remove('hidden');
        statusMessage.textContent = '✅ Conversion complete!';
        progressBar.style.width = '100%';

        await ff.deleteFile(inputName);
        await ff.deleteFile(outputName);
      } catch (err) {
        console.error(err);
        statusMessage.textContent = '❌ Error: ' + (err.message || 'Conversion failed');
      } finally {
        isConverting = false;
        convertBtn.disabled = false;
      }
    }

    // ---------- event listeners ----------
    videoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      resetUI();
      selectedFile = file;

      try {
        const meta = await loadVideoMetadata(file);
        videoMetadata = meta;

        fileSizeStat.textContent = formatBytes(meta.size);
        bitrateStat.textContent = formatBitrate(meta.bitrate);
        resolutionStat.textContent = meta.width && meta.height ? `${meta.width}×${meta.height}` : '—';
        durationStat.textContent = formatDuration(meta.duration);

        const originalBitrateMbps = meta.bitrate / 1_000_000;
        let defaultBitrate = Math.min(8, Math.max(0.2, originalBitrateMbps * 0.7));
        defaultBitrate = Math.round(defaultBitrate * 10) / 10;
        bitrateSlider.value = defaultBitrate;

        let defaultHeight = meta.height || 720;
        defaultHeight = Math.min(2160, Math.max(240, defaultHeight));
        resolutionSlider.value = defaultHeight;

        bitrateValue.textContent = defaultBitrate.toFixed(1) + ' Mbps';
        resolutionValue.textContent = resolutionLabel(defaultHeight);

        statsSection.classList.remove('hidden');
        controlsSection.classList.remove('hidden');

        updateEstimates();
        convertBtn.disabled = false;
      } catch (err) {
        console.error(err);
        statusMessage.textContent = 'Could not read video metadata.';
        statsSection.classList.add('hidden');
        controlsSection.classList.add('hidden');
      }
    });

    bitrateSlider.addEventListener('input', updateEstimates);
    resolutionSlider.addEventListener('input', updateEstimates);
    convertBtn.addEventListener('click', convertVideo);

    window.addEventListener('beforeunload', () => {
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    });
  })();
</script>
</body>
</html>
